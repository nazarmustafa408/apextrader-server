<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الإدارة - ApexTrader</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#060810;padding:15px;color:#e8edf7;min-height:100vh}
.wrap{max-width:900px;margin:0 auto}
.header{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(90deg,#141a2e,#1a2138);padding:16px 20px;border-radius:14px;margin-bottom:16px;border:1px solid #232b45}
.header h1{font-size:18px;color:#fff;font-weight:900}
.header p{font-size:11px;color:#8892b0}
.badge{padding:6px 14px;background:rgba(245,158,11,.15);color:#f59e0b;border-radius:20px;font-size:11px;font-weight:800}
.tabs{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:5px}
.tab{padding:10px 20px;background:#141a2e;border:1px solid #232b45;border-radius:12px;color:#8892b0;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.tab.active{background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff;border-color:transparent}
.panel{display:none}
.panel.active{display:block}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stat{background:#141a2e;border:1px solid #232b45;border-radius:14px;padding:16px;position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;right:0;width:100%;height:3px;background:var(--c)}
.stat .lbl{font-size:11px;color:#8892b0;margin-bottom:6px}
.stat .val{font-size:22px;font-weight:900;color:var(--c)}
.stat .sub{font-size:10px;color:#8892b0;margin-top:3px}
.section{background:#141a2e;border:1px solid #232b45;border-radius:14px;padding:18px;margin-bottom:16px}
.section h2{font-size:14px;color:#fff;margin-bottom:14px;font-weight:900}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:#8892b0;margin-bottom:6px;font-weight:700}
.field input,.field select{width:100%;padding:12px;background:#0a0e1a;border:1px solid #232b45;border-radius:10px;color:#fff;font-family:inherit;font-size:13px;box-sizing:border-box}
.field input:focus,.field select:focus{outline:none;border-color:#3b82f6}
.btn-primary{width:100%;padding:14px;background:linear-gradient(135deg,#10b981,#3b82f6);border:none;border-radius:12px;color:#fff;font-family:inherit;font-size:14px;font-weight:900;cursor:pointer}
.key-box{display:none;background:rgba(16,185,129,.1);border:2px solid #10b981;border-radius:12px;padding:15px;margin-top:12px;text-align:center}
.key-box h3{color:#10b981;font-size:14px;margin-bottom:8px}
.key-box code{display:block;background:#0a0e1a;padding:12px;border-radius:8px;color:#10b981;font-size:16px;font-weight:900;margin:8px 0;letter-spacing:2px;font-family:monospace}
table{width:100%;border-collapse:collapse}
th{background:#1a2138;padding:10px;font-size:11px;color:#8892b0;text-align:right;font-weight:700}
td{padding:10px;font-size:12px;border-bottom:1px solid #232b45;color:#e8edf7}
.status{display:inline-block;padding:3px 10px;border-radius:6px;font-size:10px;font-weight:800}
.status.active{background:rgba(16,185,129,.15);color:#10b981}
.status.pending{background:rgba(245,158,11,.15);color:#f59e0b}
.status.expired{background:rgba(239,68,68,.15);color:#ef4444}
.status.banned{background:rgba(239,68,68,.3);color:#ef4444}
.admin-input{background:#0a0e1a;border:2px solid #232b45;border-radius:10px;padding:12px;color:#fff;font-family:inherit;width:100%;margin-bottom:12px;box-sizing:border-box;text-align:center;font-size:14px}
.action-btn{padding:4px 10px;border:none;border-radius:6px;font-family:inherit;font-size:10px;font-weight:700;cursor:pointer;margin-left:3px}
.btn-ban{background:rgba(239,68,68,.15);color:#ef4444}
.btn-extend{background:rgba(16,185,129,.15);color:#10b981}
.btn-copy{background:rgba(59,130,246,.15);color:#3b82f6}
</style>
</head>
<body>
<div class="wrap">

<div class="header">
<div>
<h1>👑 لوحة إدارة ApexTrader</h1>
<p>إدارة كاملة من صفحة واحدة</p>
</div>
<div class="badge">مدير</div>
</div>

<div id="loginBox" class="section">
<h2>🔐 تسجيل دخول المدير</h2>
<input type="password" class="admin-input" id="adminKey" placeholder="أدخل مفتاح المدير" />
<button class="btn-primary" onclick="login()">دخول</button>
<p style="font-size:11px;color:#8892b0;text-align:center;margin-top:10px">المفتاح: <b>apextrader_admin_2025</b></p>
</div>

<div id="adminPanel" style="display:none">

<div class="tabs">
<button class="tab active" onclick="showTab('overview',event)">📊 نظرة عامة</button>
<button class="tab" onclick="showTab('keys',event)">🎫 المفاتيح</button>
<button class="tab" onclick="showTab('orders',event)">📋 الطلبات</button>
<button class="tab" onclick="showTab('settings',event)">⚙️ الإعدادات</button>
</div>

<div class="panel active" id="tab-overview">
<div class="stats" id="stats"></div>
</div>

<div class="panel" id="tab-keys">
<div class="section">
<h2>🎫 توليد مفتاح اشتراك</h2>
<div class="field">
<label>الخطة</label>
<select id="genPlan">
<option value="monthly">شهري - 100,000 د.ع</option>
<option value="quarterly">ربع سنوي - 280,000 د.ع</option>
<option value="semiannual">نصف سنوي - 550,000 د.ع</option>
<option value="yearly">سنوي - 1,000,000 د.ع</option>
<option value="lifetime">مدى الحياة - 2,500,000 د.ع</option>
</select>
</div>
<button class="btn-primary" onclick="generateKey()">🎫 توليد مفتاح</button>
<div class="key-box" id="keyBox">
<h3>✅ تم توليد المفتاح</h3>
<code id="newKey"></code>
<p>الخطة: <b id="newPlan"></b></p>
<p>ينتهي: <b id="newExpiry"></b></p>
</div>
</div>
<div class="section">
<h2>📋 كل المفاتيح</h2>
<div id="licensesList">لا توجد مفاتيح</div>
</div>
</div>

<div class="panel" id="tab-orders">
<div class="section">
<h2>📋 طلبات الاشتراك</h2>
<div id="ordersList">لا توجد طلبات</div>
</div>
</div>

<div class="panel" id="tab-settings">
<div class="section">
<h2>💰 أرقام الدفع</h2>
<div class="field">
<label>📱 رقم زين كاش</label>
<input type="text" id="setZaincash" />
</div>
<div class="field">
<label>💳 رقم الماستر كارد</label>
<input type="text" id="setMastercard" />
</div>
<div class="field">
<label>📞 رقم واتساب</label>
<input type="text" id="setWhatsapp" />
</div>
<button class="btn-primary" onclick="saveSettings()">💾 حفظ</button>
</div>
</div>

</div>
</div>

<script>
var adminKey='';
var settings={};

function login(){
var key=document.getElementById('adminKey').value;
if(!key){alert('أدخل المفتاح');return;}
adminKey=key;
var xhr=new XMLHttpRequest();
xhr.open('GET','/api/admin/stats?adminKey='+encodeURIComponent(key),true);
xhr.onreadystatechange=function(){
if(xhr.readyState===4){
if(xhr.status===200){
document.getElementById('loginBox').style.display='none';
document.getElementById('adminPanel').style.display='block';
sessionStorage.setItem('adminKey',key);
loadAll();
}else{
alert('مفتاح خاطئ');
}
}
};
xhr.send();
}

function showTab(name,ev){
var tabs=document.querySelectorAll('.tab');
for(var i=0;i<tabs.length;i++)tabs[i].classList.remove('active');
if(ev&&ev.target)ev.target.classList.add('active');
var panels=document.querySelectorAll('.panel');
for(var j=0;j<panels.length;j++)panels[j].classList.remove('active');
document.getElementById('tab-'+name).classList.add('active');
}

function loadAll(){
loadStats();loadOrders();loadLicenses();loadSettings();
}

function loadStats(){
var xhr=new XMLHttpRequest();
xhr.open('GET','/api/admin/stats?adminKey='+encodeURIComponent(adminKey),true);
xhr.onreadystatechange=function(){
if(xhr.readyState===4&&xhr.status===200){
var s=JSON.parse(xhr.responseText);
document.getElementById('stats').innerHTML=
'<div class="stat" style="--c:#10b981"><div class="lbl">المفاتيح النشطة</div><div class="val">'+s.activeLicenses+'</div></div>'+
'<div class="stat" style="--c:#f59e0b"><div class="lbl">طلبات معلقة</div><div class="val">'+s.pendingOrders+'</div></div>'+
'<div class="stat" style="--c:#3b82f6"><div class="lbl">إجمالي المفاتيح</div><div class="val">'+s.totalLicenses+'</div></div>'+
'<div class="stat" style="--c:#8b5cf6"><div class="lbl">الإيرادات</div><div class="val">'+s.totalRevenueFormatted+'</div></div>';
}
};
xhr.send();
}

function loadLicenses(){
var xhr=new XMLHttpRequest();
xhr.open('GET','/api/admin/licenses',true);
xhr.onreadystatechange=function(){
if(xhr.readyState===4&&xhr.status===200){
var list=JSON.parse(xhr.responseText);
var html='';
if(list.length===0){html='<p style="color:#8892b0;text-align:center">لا توجد مفاتيح</p>';}
else{
html='<table><thead><tr><th>المفتاح</th><th>العميل</th><th>الخطة</th><th>الحالة</th></tr></thead><tbody>';
for(var i=0;i<list.length;i++){
var l=list[i];
html+='<tr><td><code style="color:#3b82f6">'+l.key+'</code></td><td>'+(l.customerName||'-')+'</td><td>'+(l.planName||'-')+'</td><td><span class="status '+l.status+'">'+l.status+'</span></td></tr>';
}
html+='</tbody></table>';
}
document.getElementById('licensesList').innerHTML=html;
}
};
xhr.send();
}

function loadOrders(){
var xhr=new XMLHttpRequest();
xhr.open('GET','/api/admin/orders',true);
xhr.onreadystatechange=function(){
if(xhr.readyState===4&&xhr.status===200){
var list=JSON.parse(xhr.responseText);
var html='';
if(list.length===0){html='<p style="color:#8892b0;text-align:center">لا توجد طلبات</p>';}
else{
html='<table><thead><tr><th>الطلب</th><th>العميل</th><th>المبلغ</th><th>الحالة</th></tr></thead><tbody>';
for(var i=0;i<list.length;i++){
var o=list[i];
html+='<tr><td>'+o.id+'</td><td>'+(o.name||'-')+'</td><td>'+o.amount+'</td><td><span class="status '+o.status+'">'+o.status+'</span></td></tr>';
}
html+='</tbody></table>';
}
document.getElementById('ordersList').innerHTML=html;
}
};
xhr.send();
}

function loadSettings(){
var xhr=new XMLHttpRequest();
xhr.open('GET','/api/admin/settings?adminKey='+encodeURIComponent(adminKey),true);
xhr.onreadystatechange=function(){
if(xhr.readyState===4&&xhr.status===200){
settings=JSON.parse(xhr.responseText);
document.getElementById('setZaincash').value=settings.zaincash||'';
document.getElementById('setMastercard').value=settings.mastercard||'';
document.getElementById('setWhatsapp').value=settings.whatsapp||'';
}
};
xhr.send();
}

function generateKey(){
var plan=document.getElementById('genPlan').value;
var xhr=new XMLHttpRequest();
xhr.open('POST','/api/admin/activate',true);
xhr.setRequestHeader('Content-Type','application/json');
xhr.onreadystatechange=function(){
if(xhr.readyState===4&&xhr.status===200){
var data=JSON.parse(xhr.responseText);
document.getElementById('newKey').textContent=data.key;
document.getElementById('newPlan').textContent=data.planName;
document.getElementById('newExpiry').textContent=new Date(data.expiresAt).toLocaleDateString('ar-EG');
document.getElementById('keyBox').style.display='block';
loadAll();
}else if(xhr.readyState===4){
alert('فشل التوليد');
}
};
xhr.send(JSON.stringify({adminKey:adminKey,customPlan:plan}));
}

function saveSettings(){
var xhr=new XMLHttpRequest();
xhr.open('POST','/api/admin/settings/update',true);
xhr.setRequestHeader('Content-Type','application/json');
xhr.onreadystatechange=function(){
if(xhr.readyState===4&&xhr.status===200){
alert('✅ تم الحفظ');
}
};
xhr.send(JSON.stringify({
adminKey:adminKey,
zaincash:document.getElementById('setZaincash').value,
mastercard:document.getElementById('setMastercard').value,
whatsapp:document.getElementById('setWhatsapp').value
}));
}

var saved=sessionStorage.getItem('adminKey');
if(saved){
adminKey=saved;
document.getElementById('loginBox').style.display='none';
document.getElementById('adminPanel').style.display='block';
loadAll();
}
</script>
</body>
</html>
