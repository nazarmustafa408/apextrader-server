 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة الدردشات - ApexTrader</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#060810;color:#e8edf7;min-height:100vh}
.header{background:linear-gradient(90deg,#141a2e,#1a2138);padding:16px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #232b45}
.header h1{font-size:18px;color:#fff;font-weight:900}
.header p{font-size:11px;color:#8892b0}
.badge{padding:6px 14px;background:rgba(16,185,129,.15);color:#10b981;border-radius:20px;font-size:11px;font-weight:800}
.container{display:grid;grid-template-columns:320px 1fr;height:calc(100vh - 75px)}
@media(max-width:768px){.container{grid-template-columns:1fr}}
.sidebar{background:#0a0e1a;border-left:1px solid #232b45;overflow-y:auto;padding:10px}
.sidebar h3{font-size:12px;color:#8892b0;padding:10px;text-transform:uppercase;letter-spacing:1px}
.chat-item{padding:12px;border-radius:10px;margin-bottom:6px;cursor:pointer;border:1px solid transparent;transition:.2s}
.chat-item:hover{background:#141a2e}
.chat-item.active{background:#141a2e;border-color:#3b82f6}
.chat-item.unread{border-right:3px solid #ef4444}
.chat-item h4{font-size:13px;color:#fff;margin-bottom:3px;font-weight:700}
.chat-item p{font-size:11px;color:#8892b0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-item .meta{display:flex;justify-content:space-between;margin-top:6px;font-size:10px;color:#4a5878}
.unread-badge{background:#ef4444;color:#fff;font-size:9px;padding:2px 7px;border-radius:10px;font-weight:800}
.chat-area{display:flex;flex-direction:column;background:#0a0e1a}
.no-chat{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#8892b0}
.no-chat .icon{font-size:80px;margin-bottom:20px}
.chat-header{background:#141a2e;padding:14px 20px;border-bottom:1px solid #232b45;display:flex;align-items:center;gap:12px}
.chat-header .av{width:40px;height:40px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.chat-header h3{font-size:14px;color:#fff}
.chat-header p{font-size:11px;color:#8892b0}
.chat-header .actions{margin-right:auto;display:flex;gap:8px}
.chat-header .actions button{padding:7px 12px;background:rgba(239,68,68,.15);color:#ef4444;border:none;border-radius:8px;font-family:inherit;font-size:11px;font-weight:700;cursor:pointer}
.messages{flex:1;padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.msg{max-width:75%;padding:12px 16px;border-radius:16px;font-size:13px;line-height:1.6}
.msg.user{align-self:flex-start;background:#141a2e;border:1px solid #232b45;color:#fff;border-bottom-left-radius:4px}
.msg.admin{align-self:flex-end;background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff;border-bottom-right-radius:4px}
.msg .time{font-size:10px;color:rgba(255,255,255,.6);margin-top:5px}
.input-area{padding:15px;background:#141a2e;border-top:1px solid #232b45;display:flex;gap:10px}
.input-area textarea{flex:1;padding:12px;background:#0a0e1a;border:1px solid #232b45;border-radius:12px;color:#fff;font-family:inherit;font-size:13px;resize:none;min-height:48px;max-height:120px;box-sizing:border-box}
.input-area textarea:focus{outline:none;border-color:#3b82f6}
.input-area button{width:48px;height:48px;background:linear-gradient(135deg,#10b981,#3b82f6);border:none;border-radius:12px;color:#fff;font-size:20px;cursor:pointer;flex-shrink:0}
.login-box{position:fixed;inset:0;background:#060810;display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}

.login-box h2{font-size:20px;color:#fff;text-align:center;margin-bottom:20px}
.login-box input{width:100%;padding:14px;background:#141a2e;border:2px solid #232b45;border-radius:12px;color:#fff;font-family:inherit;font-size:14px;margin-bottom:12px;box-sizing:border-box;text-align:center}
.login-box input:focus{outline:none;border-color:#3b82f6}
.login-box button{width:100%;padding:14px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border:none;border-radius:12px;color:#fff;font-family:inherit;font-size:14px;font-weight:900;cursor:pointer}
</style>
</head>
<body>

<div class="login-box" id="loginBox">
<div class="box">
<h2>🔐 إدارة الدردشات</h2>
<input type="password" id="adminKey" placeholder="أدخل مفتاح المدير" />
<button onclick="login()">دخول</button>
</div>
</div>

<div class="header" id="mainHeader" style="display:none">
<div>
<h1>💬 إدارة الدردشات</h1>
<p>ApexTrader Live Support</p>
</div>
<div class="badge" id="onlineBadge">متصل</div>
</div>

<div class="container" id="mainContainer" style="display:none">
<div class="sidebar" id="sidebar">
<h3>المحادثات النشطة</h3>
<div id="chatsList"></div>
</div>

<div class="chat-area" id="chatArea">
<div class="no-chat" id="noChat">
<div class="icon">💬</div>
<p>اختر محادثة للبدء</p>
</div>

<div id="activeChat" style="display:none;flex:1;flex-direction:column">
<div class="chat-header">
<div class="av">👤</div>
<div>
<h3 id="activeName">-</h3>
<p id="activeEmail">-</p>
</div>
<div class="actions">
<button onclick="closeChat()">🔒 إغلاق</button>
</div>
</div>
<div class="messages" id="adminMessages"></div>
<div class="input-area">
<textarea id="adminInput" placeholder="اكتب ردك هنا..."></textarea>
<button onclick="sendReply()">📤</button>
</div>
</div>
</div>
</div>

<script>
let adminKey='';
let activeChatId=null;
let ws=null;

async function login(){
adminKey=document.getElementById('adminKey').value;
if(!adminKey)return alert('أدخل المفتاح');
const res=await fetch('/api/admin/stats?key='+adminKey);
if(res.ok){
document.getElementById('loginBox').style.display='none';
document.getElementById('mainHeader').style.display='flex';
document.getElementById('mainContainer').style.display='grid';
sessionStorage.setItem('adminKey',adminKey);
loadChats();
connectWS();
}else{
alert('مفتاح خاطئ');
}
}

async function loadChats(){
const chats=await fetch('/api/chat/admin/list').then(r=>r.json());
const list=document.getElementById('chatsList');
if(chats.length===0){list.innerHTML='<p style="color:#8892b0;text-align:center;padding:30px;font-size:12px">لا توجد محادثات</p>';return;}
list.innerHTML=chats.map(c=>
<div class="chat-item ${activeChatId===c.id?'active':''} ${c.unread>0?'unread':''}" onclick="openChat('${c.id}')">
<h4>${c.user.name}</h4>
<p>${c.lastMessage}</p>
<div class="meta">
<span>${new Date(c.lastUpdate).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}</span>
${c.unread>0?<span class="unread-badge">${c.unread}</span>:''}
</div>
</div>
).join('');
}

async function openChat(chatId){
activeChatId=chatId;
const chat=await fetch('/api/chat/'+chatId).then(r=>r.json());
document.getElementById('noChat').style.display='none';
document.getElementById('activeChat').style.display='flex';
document.getElementById('activeName').textContent=chat.user.name;
document.getElementById('activeEmail').textContent=chat.user.email;
const messages=document.getElementById('adminMessages');
messages.innerHTML=chat.messages.map(m=>
<div class="msg ${m.sender}">
${m.text}
<div class="time">${new Date(m.time).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}</div>
</div>
).join('');
messages.scrollTop=messages.scrollHeight;
loadChats();
}

async function sendReply(){
[9/12/2026 10:47 PM] mustafa: const input=document.getElementById('adminInput');
const text=input.value.trim();
if(!text||!activeChatId)return;
await fetch('/api/chat/admin/reply',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({chatId:activeChatId,message:text,adminKey})
});
const messages=document.getElementById('adminMessages');
const msg=document.createElement('div');
msg.className='msg admin';
msg.innerHTML=text+<div class="time">${new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}</div>;
messages.appendChild(msg);
messages.scrollTop=messages.scrollHeight;
input.value='';
}

async function closeChat(){
if(!confirm('إغلاق هذه المحادثة؟'))return;
await fetch('/api/chat/admin/close',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({chatId:activeChatId,adminKey})
});
activeChatId=null;
document.getElementById('activeChat').style.display='none';
document.getElementById('noChat').style.display='flex';
loadChats();
}

function connectWS(){
const protocol=location.protocol==='https:'?'wss:':'ws:';
ws=new WebSocket(protocol+'//'+location.host);
ws.onmessage=(e)=>{
try{
const msg=JSON.parse(e.data);
if(msg.type==='chat_message'){
if(msg.chatId===activeChatId&&msg.message.sender==='user'){
const messages=document.getElementById('adminMessages');
const m=document.createElement('div');
m.className='msg user';
m.innerHTML=msg.message.text+<div class="time">${new Date(msg.message.time).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}</div>;
messages.appendChild(m);
messages.scrollTop=messages.scrollHeight;
}
loadChats();
}
}catch(err){}
};
ws.onclose=()=>setTimeout(connectWS,3000);
}

document.getElementById('adminInput').addEventListener('keypress',(e)=>{
if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendReply();}
});

const saved=sessionStorage.getItem('adminKey');
if(saved){
document.getElementById('adminKey').value=saved;
login();
}
</script>
</body>
</html>
